#############################
# APPLICATION INFO
#############################
spring.application.name=projetStage
server.port=8089

#############################
# DATABASE CONFIG
#############################
spring.datasource.url=jdbc:mysql://localhost:3306/projetStage_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

#############################
# JPA / HIBERNATE CONFIG
#############################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#############################
# JACKSON (JSON) CONFIG
#############################
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

#############################
# JWT CONFIG
#############################
jwt.secret=GSDjK8Psdj8qwYV98vhJKNJ98zv1bGHY45lkjngLKJhGJHGVjkhgGFHGkjhgkjHGjkH1
jwt.expiration=3600

#############################
# CORS CONFIG
#############################
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

#############################
# LOGGING CONFIG
#############################
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{60} - %msg%n
